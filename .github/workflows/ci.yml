name: Inventory Orders API CI

on:
push:
branches:
 - main
 pull_request:
 branches:
 - main

 jobs:
 build-and-test:
 runs-on: ubuntu-latest

 steps:
 -  name: Checkout repository
	uses: actions/checkout@v4
 - name: Setup  .NET
uses: actions/setup-dotnet@v4
with:
 dotnet-version: '10.0.x'
 - name: Restore dependencies
   run: dotnet restore InventoryOrders.Api/InventoryOrders.Api.csproj
- name: BuildAPI
  run:  dotnet build InventoryOrders.Api/InventoryOrders.Api.csproj --configuration Release --no-restore
- name: tests
 run: dotnet test InventoryOrders.Tests/InventoryOrders.Tests.csproj --configuration Release




