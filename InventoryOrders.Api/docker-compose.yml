services:
  api:
    image: inventoryorders-api:latest
    ports:
      - "5162:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=InventoryOrdersDb;User ID=InventoryApiUser;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Secret: "${JWT_SECRET}"